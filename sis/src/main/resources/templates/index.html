<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Information System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sis.css}">
</head>
<body>
<div class="sis-topbar">Student Information System</div>

<main class="container-xl py-4">
    <h2 class="sis-title text-center mb-3">Student Information</h2>

    <div class="d-flex gap-2 mb-3">
        <a th:href="@{/students/new}" class="btn btn-sis btn-sm">+ Student</a>
        <a th:href="@{/scores/new}" class="btn btn-sis btn-sm">+ Score</a>
    </div>

    <div class="sis-card p-2 table-responsive">
        <table class="table sis-table align-middle mb-0">
            <thead>
            <tr>
                <th>Id</th><th>Student Id</th><th>Student Name</th><th>Subject Name</th>
                <th>Score 1</th><th>Score 2</th><th>Credit</th><th>Grade</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s, st : ${scores}">
                <td th:text="${st.count}">1</td>
                <td th:text="${s.studentCode}">2007A1</td>
                <td th:text="${s.studentName}">Nguyen Van A</td>
                <td th:text="${s.subjectName}">JAVA</td>
                <td th:text="${#numbers.formatDecimal(s.score1, 1, 'COMMA', 1, 'POINT')}">8.0</td>
                <td th:text="${#numbers.formatDecimal(s.score2, 1, 'COMMA', 1, 'POINT')}">8.0</td>
                <td th:text="${s.credit}">3</td>
                <td><span class="grade" th:classappend="${'grade-' + s.grade}" th:text="${s.grade}">A</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(scores)}">
                <td colspan="8" class="text-center text-muted py-4">No scores yet. Use + Student and + Score to add some.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
