<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sis.css}">
</head>
<body>
<div class="sis-topbar">Student Information System</div>

<main class="container py-4" style="max-width: 560px;">
    <h2 class="sis-title text-center mb-3">Add Student</h2>

    <form th:action="@{/students}" th:object="${student}" method="post" class="sis-card p-4" novalidate>
        <div class="mb-3">
            <label class="form-label" for="studentCode">Student Id</label>
            <input type="text" id="studentCode" th:field="*{studentCode}" class="form-control"
                   th:classappend="${#fields.hasErrors('studentCode')} ? 'is-invalid'" maxlength="20">
            <div class="invalid-feedback" th:errors="*{studentCode}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="fullName">Student Name</label>
            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" maxlength="100">
            <div class="invalid-feedback" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="address">Address</label>
            <input type="text" id="address" th:field="*{address}" class="form-control"
                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" maxlength="255">
            <div class="invalid-feedback" th:errors="*{address}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-sis">Save</button>
            <a th:href="@{/}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
